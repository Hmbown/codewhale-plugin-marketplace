name: Extension checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run check:wiki
      - name: Build Linux desktop test image
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: docker build -t codewhale-cu-linux -f plugins/computer-use/docker/Dockerfile plugins/computer-use
      - run: npm test
        timeout-minutes: 8
      - name: Windows controlled desktop acceptance
        if: runner.os == 'Windows'
        env:
          CU_WINDOWS_DESKTOP_TESTS: '1'
        run: node --test plugins/computer-use/tests/win32-desktop.test.mjs
      - run: npm run check:web
      - run: npm run package:plugin -- whalewiki
      - run: npm run package:plugin -- computer-use
      - run: npm run package:plugin -- cloudflare-docs
      - run: npm run package:plugin -- codewhale-skills
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: test-results/
